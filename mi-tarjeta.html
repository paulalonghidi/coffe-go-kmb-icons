<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#1E4D2B">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Tarjeta">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Mi Tarjeta">

  <title>Mi Tarjeta - COFFEE & GO kmb</title>

  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="https://paulalonghidi.github.io/coffe-go-kmb-icons/mi-tarjeta-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="https://paulalonghidi.github.io/coffe-go-kmb-icons/mi-tarjeta-192.png"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="https://paulalonghidi.github.io/coffe-go-kmb-icons/mi-tarjeta-192.png"
  >

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F5F0EB;
      font-family: Arial, sans-serif;
    }

    .cargando {
      text-align: center;
      color: #1E4D2B;
      font-size: 16px;
      font-weight: 600;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      display: block;
      margin: 0 auto 18px;
    }
  </style>
</head>

<body>

  <div class="cargando">
    <img
      class="logo"
      src="https://paulalonghidi.github.io/coffe-go-kmb-icons/mi-tarjeta-512.png"
      alt="COFFEE & GO kmb"
    >

    Abriendo tu tarjeta...
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (id) {

      const cardUrl =
        'https://script.google.com/macros/s/AKfycbwIiCTru7nGzpy6eiJWtOahMyphdVFOTXQdxCBcp2GvQD7quv16LNtWfYevu6RtaTm2Sw/exec?id='
        + encodeURIComponent(id);

      window.location.replace(cardUrl);

    } else {

      document.querySelector('.cargando').innerHTML =
        'No se encontró el ID de esta tarjeta.';

    }
  </script>

</body>
</html>
