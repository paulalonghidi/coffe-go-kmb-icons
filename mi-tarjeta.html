<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#1E4D2B">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Tarjeta">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Mi Tarjeta">

  <title>Mi Tarjeta - COFFEE & GO kmb</title>

  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="https://paulalonghidi.github.io/coffe-go-kmb-icons/mi-tarjeta-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="https://paulalonghidi.github.io/coffe-go-kmb-icons/mi-tarjeta-192.png"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="https://paulalonghidi.github.io/coffe-go-kmb-icons/mi-tarjeta-192.png"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #F5F0EB;
      font-family: 'Montserrat', sans-serif;
      color: #1E4D2B;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #FFFDFC;
      border: 2px solid #D2B48C;
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 6px 22px rgba(0,0,0,0.08);
    }

    .logo {
      width: 135px;
      height: 135px;
      border-radius: 26px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
      font-weight: 800;
    }

    .subtitle {
      margin: 0 0 22px;
      font-size: 14px;
      line-height: 1.5;
      color: #5F7D68;
    }

    .guardar {
      margin-bottom: 20px;
      padding: 18px;
      background: #F5F0EB;
      border-radius: 16px;
    }

    .guardar-titulo {
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 800;
    }

    .instruccion {
      margin: 9px 0;
      font-size: 13px;
      line-height: 1.5;
      text-align: left;
    }

    button {
      width: 100%;
      padding: 15px 18px;
      border: none;
      border-radius: 14px;
      background: #1E4D2B;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .id {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 700;
      color: #5F7D68;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 24px 18px;
      }

      .logo {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>

<body>

  <div class="card" id="contenido">

    <img
      class="logo"
      src="https://paulalonghidi.github.io/coffe-go-kmb-icons/mi-tarjeta-512.png"
      alt="COFFEE & GO kmb"
    >

    <h1>MI TARJETA</h1>

    <p class="subtitle">
      Tu tarjeta de cliente frecuente ya está lista.
    </p>

    <div class="guardar">

      <div class="guardar-titulo">
        PRIMERO GUARDA TU TARJETA
      </div>

      <p class="instruccion">
        <strong>iPhone:</strong>
        abre esta página en Safari, toca Compartir y luego
        “Añadir a pantalla de inicio”.
      </p>

      <p class="instruccion">
        <strong>Android:</strong>
        abre esta página en Chrome, toca los tres puntos y luego
        “Añadir a pantalla de inicio”.
      </p>

    </div>

    <button id="yaGuarde">
      YA GUARDÉ MI TARJETA
    </button>

    <div class="id" id="mostrarId"></div>

  </div>

  <script>

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    const WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbwIiCTru7nGzpy6eiJWtOahMyphdVFOTXQdxCBcp2GvQD7quv16LNtWfYevu6RtaTm2Sw/exec';

    const boton = document.getElementById('yaGuarde');
    const mostrarId = document.getElementById('mostrarId');

    if (!id) {

      boton.style.display = 'none';
      mostrarId.textContent = 'No se encontró el ID de esta tarjeta.';

    } else {

      mostrarId.textContent = id;

      const cardUrl =
        WEB_APP_URL + '?id=' + encodeURIComponent(id);

      const claveGuardada =
        'coffee_go_tarjeta_guardada_' + id;

      const yaFueGuardada =
        localStorage.getItem(claveGuardada);

      if (yaFueGuardada === 'si') {

        window.location.replace(cardUrl);

      } else {

        boton.addEventListener('click', function () {

          localStorage.setItem(claveGuardada, 'si');

          window.location.href = cardUrl;

        });

      }

    }

  </script>

</body>
</html>
